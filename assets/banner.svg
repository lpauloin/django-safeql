<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#08111c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <!-- Left: title, pitch, input SQL -->
  <text x="64" y="112" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1">django-safeql</text>
  <text x="66" y="158" fill="#9fb3c8" font-size="21">Run untrusted or AI-generated SQL safely.</text>
  <text x="66" y="188" fill="#9fb3c8" font-size="21">Whitelisted SQL &#8594; a real Django QuerySet.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <rect x="64" y="224" width="470" height="158" rx="14" fill="#0f2030" stroke="#1f3346"/>
    <text x="88" y="262" fill="#7dd3fc">SELECT<tspan fill="#cbd5e1"> title, author.name</tspan></text>
    <text x="88" y="290" fill="#7dd3fc">  FROM<tspan fill="#cbd5e1"> book </tspan><tspan fill="#7dd3fc">JOIN</tspan><tspan fill="#cbd5e1"> author &#8230;</tspan></text>
    <text x="88" y="318" fill="#7dd3fc"> WHERE<tspan fill="#cbd5e1"> status = </tspan><tspan fill="#86efac">'published'</tspan></text>
    <text x="88" y="358" fill="#64748b">&#8594; <tspan fill="#86efac">QuerySet</tspan><tspan fill="#64748b">  &#10003; whitelisted, parameterized</tspan></text>
  </g>

  <!-- Right: "result" card -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect x="640" y="64" width="496" height="312" rx="18" fill="#f8fafc"/>
    <rect x="640" y="64" width="496" height="46" rx="18" fill="#e2e8f0"/>
    <rect x="640" y="92" width="496" height="18" fill="#e2e8f0"/>
    <circle cx="666" cy="87" r="6" fill="#ef4444"/>
    <circle cx="686" cy="87" r="6" fill="#f59e0b"/>
    <circle cx="706" cy="87" r="6" fill="#22c55e"/>
    <text x="732" y="92" fill="#64748b" font-size="15">python</text>

    <text x="666" y="152" fill="#0f172a">&#187;&#187;&#187; to_queryset(sql)</text>
    <text x="666" y="180" fill="#15803d">&#10003; &lt;QuerySet [{'title': &#8230;}]&gt;</text>

    <text x="666" y="228" fill="#0f172a">&#187;&#187;&#187; to_queryset(</text>
    <text x="666" y="252" fill="#0f172a">        "DELETE FROM book")</text>
    <text x="666" y="280" fill="#b91c1c">&#10007; UnsupportedSQL</text>

    <text x="666" y="322" fill="#0f172a">&#187;&#187;&#187; "SELECT * FROM pg_user"</text>
    <text x="666" y="350" fill="#b91c1c">&#10007; ValidationError: Unknown table</text>
  </g>
</svg>
