[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-safeql"
version = "1.0.0"
description = "A whitelisted SQL-to-QuerySet transpiler for Django — run untrusted or AI-generated SQL safely."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Laurent Pauloin" },
]
keywords = ["django", "sql", "queryset", "orm", "sqlglot", "llm", "security"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "django>=4.2",
    "sqlglot>=30.8,<31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "pytest-cov>=5",
    "psycopg[binary]>=3.1",
    "black==24.*",
    "flake8>=7",
]

[project.urls]
Homepage = "https://github.com/lpauloin/django-safeql"
Issues = "https://github.com/lpauloin/django-safeql/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/django_safeql"]

[tool.black]
line-length = 120
target-version = ["py310"]
